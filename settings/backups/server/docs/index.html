<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quester API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui.css">
    <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.10.0/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.10.0/favicon-16x16.png" sizes="16x16">
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            padding: 0;
        }
        .topbar {
            background-color: #2c3e50;
        }
        .topbar .topbar-wrapper .link {
            color: #ecf0f1;
        }
        .topbar .topbar-wrapper .link:hover {
            color: #3498db;
        }
        .swagger-ui .info .title {
            color: #2c3e50;
        }
        .swagger-ui .info .title small {
            background-color: #3498db;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            margin-left: 10px;
        }
        .swagger-ui .scheme-container {
            background-color: #ecf0f1;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        /* Custom branding */
        .topbar-wrapper img[alt="Swagger UI"] {
            content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="40"><text x="10" y="25" font-family="Arial" font-size="20" fill="white" font-weight="bold">Quester API</text></svg>');
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
        window.onload = function() {
            // Begin Swagger UI call region
            const ui = SwaggerUIBundle({
                url: "./swagger.yaml",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                
                // Request interceptor to add authorization header
                requestInterceptor: (request) => {
                    // Get token from localStorage if exists
                    const token = localStorage.getItem('quester_access_token');
                    if (token && !request.headers['Authorization']) {
                        request.headers['Authorization'] = `Bearer ${token}`;
                    }
                    return request;
                },

                // Response interceptor to store tokens
                responseInterceptor: (response) => {
                    // Store access token from successful auth responses
                    if (response.body && response.body.data && response.body.data.access_token) {
                        localStorage.setItem('quester_access_token', response.body.data.access_token);
                        console.log('Access token stored for authenticated requests');
                    }
                    return response;
                },

                // Custom validator URL
                validatorUrl: "https://validator.swagger.io/validator",

                // Default expanded operations
                docExpansion: "list",

                // Show request duration
                showMutatedRequest: true,

                // Try it out enabled by default
                tryItOutEnabled: true,

                // Filter by tags
                filter: true,

                // Syntax highlighting theme
                syntaxHighlight: {
                    activate: true,
                    theme: "monokai"
                }
            });

            // Custom functions
            window.ui = ui;

            // Add custom buttons after UI loads
            setTimeout(() => {
                addCustomButtons();
            }, 1000);
        };

        // Add custom utility buttons
        function addCustomButtons() {
            const topbar = document.querySelector('.topbar');
            if (!topbar) return;

            const buttonContainer = document.createElement('div');
            buttonContainer.style.cssText = 'display: flex; gap: 10px; padding: 10px; justify-content: flex-end;';

            // Clear token button
            const clearTokenBtn = document.createElement('button');
            clearTokenBtn.textContent = 'Clear Token';
            clearTokenBtn.style.cssText = 'padding: 8px 16px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;';
            clearTokenBtn.onclick = () => {
                localStorage.removeItem('quester_access_token');
                alert('Access token cleared. You will need to authenticate again.');
            };

            // View token button
            const viewTokenBtn = document.createElement('button');
            viewTokenBtn.textContent = 'View Token';
            viewTokenBtn.style.cssText = 'padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;';
            viewTokenBtn.onclick = () => {
                const token = localStorage.getItem('quester_access_token');
                if (token) {
                    alert('Access Token:\n\n' + token + '\n\nCopied to clipboard!');
                    navigator.clipboard.writeText(token);
                } else {
                    alert('No access token stored. Please authenticate first.');
                }
            };

            // Test connection button
            const testConnBtn = document.createElement('button');
            testConnBtn.textContent = 'Test Connection';
            testConnBtn.style.cssText = 'padding: 8px 16px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;';
            testConnBtn.onclick = async () => {
                try {
                    const response = await fetch('/health');
                    const data = await response.json();
                    alert('Connection successful!\n\nStatus: ' + data.status + '\nVersion: ' + data.version);
                } catch (error) {
                    alert('Connection failed: ' + error.message);
                }
            };

            buttonContainer.appendChild(testConnBtn);
            buttonContainer.appendChild(viewTokenBtn);
            buttonContainer.appendChild(clearTokenBtn);
            
            topbar.appendChild(buttonContainer);
        }

        // Helper function to decode JWT (for debugging)
        function parseJWT(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }
    </script>
</body>
</html>
