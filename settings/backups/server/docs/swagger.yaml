        owner_id:
          type: string
          format: uuid
          description: Property owner user ID
        title:
          type: string
          example: "Luxury 3BHK Villa with Pool"
        description:
          type: string
          example: "Spacious villa in prime location"
        property_type:
          type: string
          enum: [residential, commercial, agricultural, industrial]
        listing_type:
          type: string
          enum: [sale, rent, lease]
        price:
          type: number
          format: float
          example: 5000000
        location:
          $ref: '#/components/schemas/Location'
        bedrooms:
          type: integer
          example: 3
        bathrooms:
          type: integer
          example: 2
        area_sqft:
          type: number
          format: float
          example: 2000
        amenities:
          type: array
          items:
            type: string
          example: ["pool", "parking", "garden"]
        images:
          type: array
          items:
            type: string
            format: uri
        status:
          type: string
          enum: [draft, published, sold, rented, archived]
          example: "published"
        verification_status:
          type: string
          enum: [pending, verified, rejected]
          example: "verified"
        views_count:
          type: integer
