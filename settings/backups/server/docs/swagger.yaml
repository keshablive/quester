    Certificate:
      type: object
      required:
        - id
        - tenant_id
        - recipient_id
        - type
        - title
        - certificate_number
        - issued_at
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174002"
        tenant_id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
          description: User who received the certificate
        issuer_id:
          type: string
          format: uuid
          description: User or system that issued the certificate
        type:
          type: string
          enum: [course, quest, achievement]
          example: "course"
        title:
          type: string
          example: "Advanced JavaScript Programming"
        description:
          type: string
          example: "Successfully completed 40-hour course"
        certificate_number:
          type: string
          example: "CERT-2025-001234"
          description: Unique certificate identifier
        verification_code:
          type: string
          example: "ABC123XYZ"
          description: Public verification code
        metadata:
          type: object
          additionalProperties: true
          example:
            course_id: "uuid-course-123"
            completion_date: "2025-11-15"
            grade: "A"
        issued_at:
          type: string
          format: date-time
        verified:
          type: boolean
          example: true
        revoked:
          type: boolean
          example: false
        revoked_at:
          type: string
          format: date-time
          nullable: true

    Transaction:
      type: object
      required:
        - id
        - tenant_id
        - listing_id
        - buyer_id
        - seller_id
        - amount
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174003"
        tenant_id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
          description: Marketplace listing being transacted
        buyer_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
          example: 5000
          description: Transaction amount
        currency:
          type: string
          example: "INR"
        commission_rate:
          type: number
          format: float
          example: 0.05
          description: Platform commission (0.05 = 5%)
        commission_amount:
          type: number
          format: float
          example: 250
        payout_amount:
          type: number
          format: float
          example: 4750
          description: Amount seller receives after commission
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled, disputed, refunded]
          example: "confirmed"
        payment_method:
          type: string
          enum: [razorpay, stripe]
          example: "razorpay"
        payment_id:
          type: string
          example: "pay_razorpay_123456"
          description: Payment gateway transaction ID
        escrow_status:
          type: string
          enum: [held, released, refunded]
          example: "held"
        dispute_reason:
          type: string
          nullable: true
        dispute_resolution:
          type: string
          nullable: true
        buyer_rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        buyer_feedback:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    
    Quest:
