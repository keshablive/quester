# Prometheus Configuration for Quester Video Streaming

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'quester-local'
    replica: '0'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Quester API Server metrics
  - job_name: 'quester-api'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL metrics (if pg_exporter is running)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis metrics (if redis_exporter is running)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # RTMP server metrics (custom exporter)
  - job_name: 'rtmp-server'
    static_configs:
      - targets: ['nginx-rtmp:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
