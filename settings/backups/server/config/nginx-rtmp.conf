# Quester Platform - nginx-rtmp Configuration
# Feature #003: Video Streaming Platform

worker_processes auto;
rtmp_auto_push on;
events {
    worker_connections 1024;
}

# RTMP Configuration
rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;

        application live {
            live on;
            record off;

            # HLS Configuration
            hls on;
            hls_path /tmp/hls;
            hls_fragment 6s;
            hls_playlist_length 60s;
            
            # Enable DVR (recording)
            hls_continuous on;
            
            # Enable recording
            record all;
            record_path /tmp/recordings;
            record_suffix -%Y%m%d-%H%M%S.flv;
            record_max_size 100M;
            
            # TODO: Enable authentication after API proxy is configured
            # on_publish http://host.docker.internal:8080/api/v1/rtmp/auth;
            # on_publish_done http://host.docker.internal:8080/api/v1/rtmp/unpublish;
            # on_play http://host.docker.internal:8080/api/v1/rtmp/play;
            # on_play_done http://host.docker.internal:8080/api/v1/rtmp/play_done;
            
            # Allow all for testing (disable in production)
            allow publish all;
            allow play all;
        }
    }
}

# HTTP Configuration
http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # HLS HTTP Server
    server {
        listen 80;
        server_name _;

        # CORS headers for video playback
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range' always;

        # HLS stream serving
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # RTMP statistics
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/local/nginx/html;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
