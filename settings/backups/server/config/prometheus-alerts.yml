groups:
  - name: streaming_performance
    interval: 30s
    rules:
      # P95 Latency Alerts
      - alert: StreamLatencyWarning
        expr: histogram_quantile(0.95, rate(stream_latency_seconds_bucket[5m])) > 3
        for: 2m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "Stream P95 latency above 3 seconds"
          description: "P95 stream latency is {{ $value | humanizeDuration }} (threshold: 3s). Stream: {{ $labels.stream_id }}, Quality: {{ $labels.quality }}, Tenant: {{ $labels.tenant_id }}"
          runbook_url: "https://docs.example.com/runbooks/streaming/high-latency"

      - alert: StreamLatencyCritical
        expr: histogram_quantile(0.95, rate(stream_latency_seconds_bucket[5m])) > 5
        for: 1m
        labels:
          severity: critical
          component: streaming
          page: "true"
        annotations:
          summary: "Stream P95 latency critically high (>5s)"
          description: "P95 stream latency is {{ $value | humanizeDuration }} (critical threshold: 5s). Immediate action required. Stream: {{ $labels.stream_id }}, Quality: {{ $labels.quality }}"
          runbook_url: "https://docs.example.com/runbooks/streaming/critical-latency"

      # Circuit Breaker Alerts
      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 1
        for: 30s
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "Circuit breaker is open"
          description: "Circuit breaker has opened, requests are being rejected. This indicates repeated failures in the streaming service."
          runbook_url: "https://docs.example.com/runbooks/streaming/circuit-breaker"

      - alert: CircuitBreakerOpenExtended
        expr: circuit_breaker_state == 1
        for: 5m
        labels:
          severity: critical
          component: streaming
          page: "true"
        annotations:
          summary: "Circuit breaker open for extended period"
          description: "Circuit breaker has been open for >5 minutes. Service is degraded."
          runbook_url: "https://docs.example.com/runbooks/streaming/circuit-breaker-extended"

      - alert: HighCircuitBreakerTimeoutRate
        expr: rate(circuit_breaker_timeouts_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "High rate of circuit breaker timeouts"
          description: "Circuit breaker is timing out {{ $value | humanize }} requests/sec. Latency threshold: 5s."
          runbook_url: "https://docs.example.com/runbooks/streaming/high-timeouts"

      # Stream Error Alerts
      - alert: HighStreamErrorRate
        expr: rate(stream_errors_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "High stream error rate"
          description: "Stream errors occurring at {{ $value | humanize }} errors/sec. Error type: {{ $labels.error_type }}, Tenant: {{ $labels.tenant_id }}"
          runbook_url: "https://docs.example.com/runbooks/streaming/high-errors"

      - alert: CriticalStreamErrorRate
        expr: rate(stream_errors_total[5m]) > 20
        for: 1m
        labels:
          severity: critical
          component: streaming
          page: "true"
        annotations:
          summary: "Critical stream error rate"
          description: "Stream errors at critical rate: {{ $value | humanize }} errors/sec. Error type: {{ $labels.error_type }}"
          runbook_url: "https://docs.example.com/runbooks/streaming/critical-errors"

      # Transcoding Alerts
      - alert: SlowTranscoding
        expr: histogram_quantile(0.95, rate(transcoding_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
          component: transcoding
        annotations:
          summary: "P95 transcoding duration above 10 seconds"
          description: "Transcoding is slow: P95={{ $value | humanizeDuration }}. Stream: {{ $labels.stream_id }}, Output: {{ $labels.output_quality }}"
          runbook_url: "https://docs.example.com/runbooks/transcoding/slow"

      - alert: HighTranscodingErrorRate
        expr: rate(transcoding_errors_total[5m]) > 2
        for: 2m
        labels:
          severity: warning
          component: transcoding
        annotations:
          summary: "High transcoding error rate"
          description: "Transcoding errors at {{ $value | humanize }} errors/sec. Error type: {{ $labels.error_type }}"
          runbook_url: "https://docs.example.com/runbooks/transcoding/errors"

      # Capacity Alerts
      - alert: HighActiveStreamCount
        expr: sum by (tenant_id) (active_streams) > 100
        for: 5m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "High active stream count"
          description: "Tenant {{ $labels.tenant_id }} has {{ $value }} active streams (threshold: 100). May need capacity scaling."
          runbook_url: "https://docs.example.com/runbooks/streaming/capacity"

      - alert: CriticalActiveStreamCount
        expr: sum by (tenant_id) (active_streams) > 200
        for: 2m
        labels:
          severity: critical
          component: streaming
          page: "true"
        annotations:
          summary: "Critical active stream count"
          description: "Tenant {{ $labels.tenant_id }} has {{ $value }} active streams (critical threshold: 200). Immediate scaling required."
          runbook_url: "https://docs.example.com/runbooks/streaming/critical-capacity"

      # Segment Generation Alerts
      - alert: SlowSegmentGeneration
        expr: histogram_quantile(0.95, rate(stream_segment_generation_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "Slow HLS segment generation"
          description: "P95 segment generation time is {{ $value | humanizeDuration }} (threshold: 5s). Quality: {{ $labels.quality }}"
          runbook_url: "https://docs.example.com/runbooks/streaming/slow-segments"

      # Viewer Alerts
      - alert: ViewerCountSpike
        expr: |
          (stream_viewers - stream_viewers offset 5m) / stream_viewers offset 5m > 2
        for: 1m
        labels:
          severity: info
          component: streaming
        annotations:
          summary: "Sudden spike in viewer count"
          description: "Stream {{ $labels.stream_id }} viewer count increased by {{ $value | humanizePercentage }}. Current: {{ stream_viewers }}. May need scaling."
          runbook_url: "https://docs.example.com/runbooks/streaming/viewer-spike"

      # DVR Alerts
      - alert: DVRStorageHigh
        expr: sum by (stream_id) (dvr_segments_stored) > 10000
        for: 5m
        labels:
          severity: warning
          component: dvr
        annotations:
          summary: "High DVR segment storage"
          description: "Stream {{ $labels.stream_id }} has {{ $value }} segments stored. Check retention policies."
          runbook_url: "https://docs.example.com/runbooks/dvr/storage"

      - alert: DVRWindowExtended
        expr: dvr_window_seconds > 86400
        for: 10m
        labels:
          severity: info
          component: dvr
        annotations:
          summary: "DVR window exceeds 24 hours"
          description: "Stream {{ $labels.stream_id }} has DVR window of {{ $value | humanizeDuration }} (max: 24h). Verify configuration."
          runbook_url: "https://docs.example.com/runbooks/dvr/window"

  - name: streaming_availability
    interval: 30s
    rules:
      # Service Health
      - alert: StreamingServiceDown
        expr: up{job="streaming-service"} == 0
        for: 1m
        labels:
          severity: critical
          component: streaming
          page: "true"
        annotations:
          summary: "Streaming service is down"
          description: "Streaming service instance {{ $labels.instance }} is unreachable."
          runbook_url: "https://docs.example.com/runbooks/streaming/service-down"

      - alert: HighStreamingServiceMemory
        expr: |
          (process_resident_memory_bytes{job="streaming-service"} 
          / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "Streaming service high memory usage"
          description: "Instance {{ $labels.instance }} using {{ $value | humanizePercentage }} of memory."
          runbook_url: "https://docs.example.com/runbooks/streaming/high-memory"

      - alert: HighStreamingServiceCPU
        expr: |
          rate(process_cpu_seconds_total{job="streaming-service"}[5m]) > 0.9
        for: 5m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "Streaming service high CPU usage"
          description: "Instance {{ $labels.instance }} using {{ $value | humanizePercentage }} CPU."
          runbook_url: "https://docs.example.com/runbooks/streaming/high-cpu"

  - name: streaming_sla
    interval: 1m
    rules:
      # SLA Tracking
      - record: streaming:latency:p95:5m
        expr: histogram_quantile(0.95, rate(stream_latency_seconds_bucket[5m]))

      - record: streaming:latency:p99:5m
        expr: histogram_quantile(0.99, rate(stream_latency_seconds_bucket[5m]))

      - record: streaming:error_rate:5m
        expr: rate(stream_errors_total[5m])

      - record: streaming:success_rate:5m
        expr: |
          1 - (rate(stream_errors_total[5m]) 
          / rate(circuit_breaker_requests_total[5m]))

      - record: streaming:availability:5m
        expr: |
          sum(rate(circuit_breaker_requests_total{result="success"}[5m]))
          /
          sum(rate(circuit_breaker_requests_total[5m]))

      # SLA Violations
      - alert: SLALatencyViolation
        expr: streaming:latency:p95:5m > 3
        for: 10m
        labels:
          severity: critical
          component: streaming
          sla_violation: "true"
        annotations:
          summary: "SLA violation: P95 latency >3s for 10+ minutes"
          description: "P95 latency {{ $value | humanizeDuration }} exceeds SLA target of 3s."
          runbook_url: "https://docs.example.com/runbooks/sla/latency"

      - alert: SLAAvailabilityViolation
        expr: streaming:availability:5m < 0.99
        for: 5m
        labels:
          severity: critical
          component: streaming
          sla_violation: "true"
          page: "true"
        annotations:
          summary: "SLA violation: Availability <99%"
          description: "Service availability is {{ $value | humanizePercentage }} (SLA target: 99%)."
          runbook_url: "https://docs.example.com/runbooks/sla/availability"
