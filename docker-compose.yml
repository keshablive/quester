version: "3.8"

services:
  # ==============================================
  # Core Application Services
  # ==============================================

  client:
    build:
      context: .
      dockerfile: settings/docker/client.dockerfile
    container_name: quester_client
    ports:
      - "3000:80"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - server
    networks:
      - quester_network
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: settings/docker/server.dockerfile
      target: dev
    container_name: quester_server
    ports:
      - "8000:8000"
      - "2345:2345" # Debugger port
    env_file:
      - .env
    volumes:
      - ./server:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quester_network
    restart: unless-stopped

  # ==============================================
  # Infrastructure Services
  # ==============================================

  postgres:
    image: postgis/postgis:15-3.3
    container_name: quester_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quester_db}
      POSTGRES_USER: ${POSTGRES_USER:-quester_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quester_pass123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/internal/migrations:/migrations
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-quester_user} -d ${POSTGRES_DB:-quester_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quester_network

  redis:
    image: redis:7.0-alpine
    container_name: quester_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - quester_network

  # ==============================================
  # Feature Services
  # ==============================================

  # Feature #003: nginx-rtmp for video streaming
  nginx-rtmp:
    image: tiangolo/nginx-rtmp:latest
    container_name: quester_nginx_rtmp
    ports:
      - "1935:1935" # RTMP port
      - "8080:80" # HTTP for HLS (Note: Mapped to 8080 host, 80 container)
    volumes:
      - ./server/config/nginx-rtmp.conf:/etc/nginx/nginx.conf:ro
      - ./tmp/hls:/tmp/hls
      - ./tmp/recordings:/tmp/recordings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/stat"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - quester_network
    restart: unless-stopped

  # LocalStack for S3 emulation (local development)
  localstack:
    image: localstack/localstack:latest
    container_name: quester_localstack
    ports:
      - "4566:4566" # LocalStack edge port
      - "4571:4571" # S3 endpoint
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/var/lib/localstack
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quester_network

  # ==============================================
  # Observability & Tools
  # ==============================================

  prometheus:
    image: prom/prometheus:latest
    container_name: quester_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./server/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - quester_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: quester_grafana
    ports:
      - "3001:3000" # Moved to 3001 to avoid conflict with Client
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./server/config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./server/config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - quester_network
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: quester_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - quester_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  localstack_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  quester_network:
    driver: bridge
