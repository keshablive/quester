openapi: 3.0.3
info:
  title: Quester Leaderboard API
  description: API endpoints for leaderboard rankings and user positions
  version: 1.0.0
  
servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Leaderboards
    description: Public leaderboard endpoints
  - name: User Position
    description: User-specific leaderboard position
  - name: Admin
    description: Administrative operations

paths:
  /leaderboards/{type}:
    get:
      tags:
        - Leaderboards
      summary: Get leaderboard rankings
      description: Returns paginated list of top users for the specified leaderboard type
      operationId: getLeaderboard
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          description: Leaderboard type
          schema:
            type: string
            enum: [global, category]
        - name: period
          in: query
          description: Time period for rankings
          schema:
            type: string
            enum: [alltime, monthly]
            default: alltime
        - name: category
          in: query
          description: Category name (required when type=category)
          schema:
            type: string
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Results per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=300"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '400':
          description: Bad request (invalid type, period, or missing category)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable (Redis down)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}/leaderboard-position:
    get:
      tags:
        - User Position
      summary: Get user's leaderboard position
      description: Returns the user's rank, percentile, and position details
      operationId: getUserPosition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          description: Leaderboard type
          schema:
            type: string
            enum: [global, category]
            default: global
        - name: period
          in: query
          description: Time period
          schema:
            type: string
            enum: [alltime, monthly]
            default: alltime
        - name: category
          in: query
          description: Category name (required when type=category)
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                example: "private, max-age=120"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPositionResponse'
        '400':
          description: Bad request (invalid UUID or parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable (Redis down)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/leaderboards/invalidate:
    post:
      tags:
        - Admin
      summary: Invalidate leaderboard cache
      description: Admin-only endpoint to clear Redis cache for a leaderboard
      operationId: invalidateLeaderboardCache
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvalidateCacheRequest'
      responses:
        '200':
          description: Cache invalidated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidateCacheResponse'
        '400':
          description: Bad request (invalid leaderboard type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable (Redis down)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LeaderboardEntry:
      type: object
      required:
        - rank
        - user_id
        - username
        - metric_value
      properties:
        rank:
          type: integer
          description: 1-based rank position
          example: 1
        user_id:
          type: string
          format: uuid
          description: User identifier
        username:
          type: string
          description: Display name
          example: "TopPlayer"
        avatar:
          type: string
          description: Profile image URL
          example: "https://example.com/avatar.jpg"
        metric_value:
          type: integer
          description: Score or XP value
          example: 15000

    LeaderboardResponse:
      type: object
      required:
        - leaderboard_type
        - period
        - entries
        - pagination
      properties:
        leaderboard_type:
          type: string
          enum: [global, category]
        period:
          type: string
          enum: [alltime, monthly]
        category:
          type: string
          description: Category name (empty for global)
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'

    UserPositionResponse:
      type: object
      required:
        - user_id
        - leaderboard_type
        - period
        - period_key
        - rank
        - metric_value
        - total_users
        - percentile
      properties:
        user_id:
          type: string
          format: uuid
        leaderboard_type:
          type: string
          enum: [global, category]
        period:
          type: string
          enum: [alltime, monthly]
        period_key:
          type: string
          description: Period identifier (alltime or YYYY-MM)
          example: "alltime"
        category:
          type: string
          description: Category name (empty for global)
        rank:
          type: integer
          description: 1-based rank (0 if not ranked)
          example: 42
        metric_value:
          type: integer
          description: User's score
          example: 750
        total_users:
          type: integer
          description: Total users in leaderboard
          example: 1000
        percentile:
          type: integer
          description: User's percentile (0-100)
          minimum: 0
          maximum: 100
          example: 96

    InvalidateCacheRequest:
      type: object
      required:
        - leaderboard_type
      properties:
        leaderboard_type:
          type: string
          enum: [global, category]
        category:
          type: string
          description: Category to invalidate (required if type=category)

    InvalidateCacheResponse:
      type: object
      required:
        - message
        - leaderboard_type
        - invalidated_at
      properties:
        message:
          type: string
          example: "Leaderboard cache invalidated successfully"
        leaderboard_type:
          type: string
          enum: [global, category]
        category:
          type: string
        invalidated_at:
          type: string
          format: date-time

    Pagination:
      type: object
      required:
        - page
        - limit
        - total
        - total_pages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        total_pages:
          type: integer
          example: 5

    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error description"
        error_code:
          type: string
          example: "VALIDATION_ERROR"
